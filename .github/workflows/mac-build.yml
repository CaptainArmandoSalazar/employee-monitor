              "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r ".[] | select(.name == \"$FILENAME\") | .id")

            if [ -n "$STILL_EXISTS" ]; then
              echo "⚠️ Asset still exists, waiting 10 more seconds..."
              sleep 10
            fi

            echo "⬆️ Uploading $FILENAME..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
              --data-binary @"$file")

            echo "Upload HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "201" ]; then
              echo "✅ Uploaded $FILENAME"
