name: Build & Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --mac dmg --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Create Release + Upload Mac
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Create release
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases" \
            -d "{\"tag_name\":\"v$VERSION\",\"name\":\"v$VERSION\",\"draft\":false,\"prerelease\":false}")

          RELEASE_ID=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to create release"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Release created: $RELEASE_ID"

          # Upload all mac files
          for file in release/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$(basename $file)" \
                --data-binary @"$file"
            fi
          done

  build-linux:
    runs-on: ubuntu-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js
        working-directory: Desktop_App_electron

      - run: npx electron-builder --linux AppImage deb --publish never
        working-directory: Desktop_App_electron

      - name: Upload Linux files
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          RELEASE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION")

          RELEASE_ID=$(echo $RELEASE | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          for file in release/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$(basename $file)" \
                --data-binary @"$file"
            fi
          done

  build-windows:
    runs-on: windows-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --win nsis --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Upload Windows files
        working-directory: Desktop_App_electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          RELEASE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION")

          RELEASE_ID=$(echo $RELEASE | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          for file in release/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$(basename $file)" \
                --data-binary @"$file"
            fi
          done