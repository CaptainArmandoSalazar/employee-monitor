              set -e; exit 1
            fi
          }

          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Version: $VERSION"

          RELEASE_ID=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_SLUG/releases/tags/v$VERSION" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found for v$VERSION"
            exit 1
          fi

          echo "✅ Found release: $RELEASE_ID"

          # Windows uploads only: .exe and .exe.blockmap files
          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              case "$FILENAME" in
                *.exe|*.exe.blockmap|latest.yml)
                  delete_and_upload "$RELEASE_ID" "$file"
