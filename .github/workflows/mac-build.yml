name: Build & Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: brew install jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --mac dmg --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Create Release + Upload Mac
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          upload_asset() {
            local RELEASE_ID=$1
            local file=$2
            local FILENAME=$(basename "$file")
            local ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$FILENAME'''))")

            echo "---"
            echo "📁 Processing: $FILENAME"

            # Fetch existing assets
            ASSETS_RESPONSE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")

            ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")

            if [ -n "$ASSET_ID" ]; then
              echo "🗑️ Deleting existing asset: $FILENAME (ID: $ASSET_ID)"
              curl -s -o /dev/null -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID"
              echo "⏳ Waiting for GitHub to process deletion..."
              sleep 5
            else
              echo "ℹ️ No existing asset found, uploading fresh."
            fi

            # Upload (with one retry if 422)
            for attempt in 1 2; do
              echo "⬆️ Uploading $FILENAME (attempt $attempt)..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
                --data-binary @"$file")

              echo "Upload HTTP status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" = "201" ]; then
                echo "✅ Uploaded $FILENAME"
                return 0
              elif [ "$HTTP_STATUS" = "422" ] && [ "$attempt" = "1" ]; then
                echo "⚠️ 422 conflict on attempt 1 — asset may still exist. Retrying delete..."
                # Re-fetch and delete again
                ASSETS_RESPONSE=$(curl -s \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")
                ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")
                if [ -n "$ASSET_ID" ]; then
                  curl -s -o /dev/null -X DELETE \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID"
                  echo "⏳ Waiting after retry delete..."
                  sleep 8
                fi
              else
                echo "❌ Upload failed for $FILENAME with status $HTTP_STATUS"
                exit 1
              fi
            done
          }

          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Version from package.json: $VERSION"

          RELEASE_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release v$VERSION..."
            CREATE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases" \
              -d "{\"tag_name\":\"v$VERSION\",\"name\":\"v$VERSION\",\"draft\":false,\"prerelease\":false}")
            echo "Create response: $CREATE_RESPONSE"
            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id // empty')
          else
            echo "✅ Release already exists: $RELEASE_ID"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to get or create release ID. Aborting."
            exit 1
          fi

          for file in release/*; do
            [ -f "$file" ] && upload_asset "$RELEASE_ID" "$file"
          done


  build-linux:
    runs-on: ubuntu-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js
        working-directory: Desktop_App_electron

      - run: npx electron-builder --linux AppImage deb --publish never
        working-directory: Desktop_App_electron

      - name: Upload Linux files
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          upload_asset() {
            local RELEASE_ID=$1
            local file=$2
            local FILENAME=$(basename "$file")
            local ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$FILENAME'''))")

            echo "---"
            echo "📁 Processing: $FILENAME"

            ASSETS_RESPONSE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")

            ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")

            if [ -n "$ASSET_ID" ]; then
              echo "🗑️ Deleting existing asset: $FILENAME (ID: $ASSET_ID)"
              curl -s -o /dev/null -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID"
              echo "⏳ Waiting for GitHub to process deletion..."
              sleep 5
            else
              echo "ℹ️ No existing asset found, uploading fresh."
            fi

            for attempt in 1 2; do
              echo "⬆️ Uploading $FILENAME (attempt $attempt)..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
                --data-binary @"$file")

              echo "Upload HTTP status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" = "201" ]; then
                echo "✅ Uploaded $FILENAME"
                return 0
              elif [ "$HTTP_STATUS" = "422" ] && [ "$attempt" = "1" ]; then
                echo "⚠️ 422 conflict — retrying delete..."
                ASSETS_RESPONSE=$(curl -s \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")
                ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")
                if [ -n "$ASSET_ID" ]; then
                  curl -s -o /dev/null -X DELETE \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID"
                  echo "⏳ Waiting after retry delete..."
                  sleep 8
                fi
              else
                echo "❌ Upload failed for $FILENAME with status $HTTP_STATUS"
                exit 1
              fi
            done
          }

          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Version from package.json: $VERSION"

          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found for v$VERSION"
            exit 1
          fi

          echo "✅ Found release: $RELEASE_ID"

          for file in release/*; do
            [ -f "$file" ] && upload_asset "$RELEASE_ID" "$file"
          done


  build-windows:
    runs-on: windows-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: choco install jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --win nsis --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Upload Windows files
        working-directory: Desktop_App_electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          upload_asset() {
