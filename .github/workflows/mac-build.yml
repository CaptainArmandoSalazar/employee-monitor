name: Build & Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: brew install jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --mac dmg --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Create Release + Upload Mac
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "Checking if release exists..."

          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release v$VERSION..."

            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases" \
              -d "{\"tag_name\":\"v$VERSION\",\"name\":\"v$VERSION\",\"draft\":false,\"prerelease\":false}" \
              | jq -r '.id')
          else
            echo "Release already exists: $RELEASE_ID"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to get release ID"
            exit 1
          fi

          echo "Uploading Mac files..."

          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "Uploading $FILENAME..."

              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$FILENAME" \
                --data-binary @"$file"

              echo "✅ Uploaded $FILENAME"
            fi
          done


  build-linux:
    runs-on: ubuntu-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js
        working-directory: Desktop_App_electron

      - run: npx electron-builder --linux AppImage deb --publish never
        working-directory: Desktop_App_electron

      - name: Upload Linux files
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION" \
            | jq -r '.id')

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found"
            exit 1
          fi

          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "Uploading $FILENAME..."

              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$FILENAME" \
                --data-binary @"$file"
            fi
          done


  build-windows:
    runs-on: windows-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: choco install jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --win nsis --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Upload Windows files
        working-directory: Desktop_App_electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION" \
            | jq -r '.id')

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found"
            exit 1
          fi

          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "Uploading $FILENAME..."

              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$FILENAME" \
                --data-binary @"$file"
            fi
          done