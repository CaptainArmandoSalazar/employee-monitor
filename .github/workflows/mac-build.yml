name: Build & Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: brew install jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --mac dmg --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Create Release + Upload Mac
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Version from package.json: $VERSION"

          echo "Checking if release exists..."

          RELEASE_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION")

          echo "Release API response: $RELEASE_RESPONSE"

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release v$VERSION..."

            CREATE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases" \
              -d "{\"tag_name\":\"v$VERSION\",\"name\":\"v$VERSION\",\"draft\":false,\"prerelease\":false}")

            echo "Create release response: $CREATE_RESPONSE"
            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id // empty')
          else
            echo "✅ Release already exists: $RELEASE_ID"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to get or create release ID. Aborting."
            exit 1
          fi

          echo "Uploading Mac files to release $RELEASE_ID..."

          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "---"
              echo "📁 Processing: $FILENAME"

              ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$FILENAME'''))")

              # Fetch all existing assets and find matching one
              ASSETS_RESPONSE=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")

              echo "Assets on release: $(echo "$ASSETS_RESPONSE" | jq -r '.[].name')"

              ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")

              if [ -n "$ASSET_ID" ]; then
                echo "🗑️ Deleting existing asset: $FILENAME (ID: $ASSET_ID)"
                DELETE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID")
                echo "Delete status: $DELETE_STATUS"
              else
                echo "ℹ️ No existing asset found for $FILENAME, uploading fresh."
              fi

              echo "⬆️ Uploading $FILENAME..."

              UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
                --data-binary @"$file")

              HTTP_STATUS=$(echo "$UPLOAD_RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
              echo "Upload HTTP status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" != "201" ]; then
                echo "❌ Upload failed for $FILENAME with status $HTTP_STATUS"
                echo "$UPLOAD_RESPONSE"
                exit 1
              fi

              echo "✅ Uploaded $FILENAME"
            fi
          done


  build-linux:
    runs-on: ubuntu-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js
        working-directory: Desktop_App_electron

      - run: npx electron-builder --linux AppImage deb --publish never
        working-directory: Desktop_App_electron

      - name: Upload Linux files
        working-directory: Desktop_App_electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Version from package.json: $VERSION"

          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found for v$VERSION"
            exit 1
          fi

          echo "✅ Found release: $RELEASE_ID"

          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "---"
              echo "📁 Processing: $FILENAME"

              ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$FILENAME'''))")

              ASSETS_RESPONSE=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")

              ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")

              if [ -n "$ASSET_ID" ]; then
                echo "🗑️ Deleting existing asset: $FILENAME (ID: $ASSET_ID)"
                curl -s -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID"
              else
                echo "ℹ️ No existing asset found for $FILENAME, uploading fresh."
              fi

              echo "⬆️ Uploading $FILENAME..."

              UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
                --data-binary @"$file")

              HTTP_STATUS=$(echo "$UPLOAD_RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
              echo "Upload HTTP status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" != "201" ]; then
                echo "❌ Upload failed for $FILENAME with status $HTTP_STATUS"
                echo "$UPLOAD_RESPONSE"
                exit 1
              fi

              echo "✅ Uploaded $FILENAME"
            fi
          done


  build-windows:
    runs-on: windows-latest
    needs: build-mac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: choco install jq

      - run: npm install
        working-directory: Desktop_App_electron

      - run: npm run build
        working-directory: Desktop_App_electron

      - run: npx electron-builder --win nsis --x64 --publish never
        working-directory: Desktop_App_electron

      - name: Upload Windows files
        working-directory: Desktop_App_electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Version from package.json: $VERSION"

          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION" \
            | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found for v$VERSION"
            exit 1
          fi

          echo "✅ Found release: $RELEASE_ID"

          for file in release/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "---"
              echo "📁 Processing: $FILENAME"

              ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$FILENAME'''))")

              ASSETS_RESPONSE=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets")

              ASSET_ID=$(echo "$ASSETS_RESPONSE" | jq -r ".[] | select(.name == \"$FILENAME\") | .id")

              if [ -n "$ASSET_ID" ]; then
                echo "🗑️ Deleting existing asset: $FILENAME (ID: $ASSET_ID)"
                curl -s -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/assets/$ASSET_ID"
              else
                echo "ℹ️ No existing asset found for $FILENAME, uploading fresh."
              fi

              echo "⬆️ Uploading $FILENAME..."

              UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
                --data-binary @"$file")

              HTTP_STATUS=$(echo "$UPLOAD_RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
              echo "Upload HTTP status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" != "201" ]; then
                echo "❌ Upload failed for $FILENAME with status $HTTP_STATUS"
                echo "$UPLOAD_RESPONSE"
                exit 1
              fi

              echo "✅ Uploaded $FILENAME"
            fi
          done