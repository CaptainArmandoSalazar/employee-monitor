name: Build macOS
on:
  push:
    branches: [ add/pipeline ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: Desktop_App_electron
        run: npm install

      - name: Build
        working-directory: Desktop_App_electron
        run: npm run build

      - name: Package macOS
        working-directory: Desktop_App_electron
        run: npx electron-builder --mac dmg --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: Desktop_App_electron/release/*.dmg
