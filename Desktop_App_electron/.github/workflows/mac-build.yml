name: Build macOS
on:
  push:
    branches: [ add/pipeline ]
  workflow_dispatch:

jobs:
  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: Desktop_App_electron
        run: npm install

      - name: Build TypeScript
        working-directory: Desktop_App_electron
        run: npm run build

      - name: Copy inputWorker
        working-directory: Desktop_App_electron
        run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js

      - name: Package macOS Intel
        working-directory: Desktop_App_electron
        run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Remove quarantine from DMG
        run: |
          cd Desktop_App_electron/release
          for dmg in *.dmg; do
            xattr -rc "$dmg"
          done

      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-dmg
          path: Desktop_App_electron/release/*.dmg

  build-mac-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: Desktop_App_electron
        run: npm install

      - name: Build TypeScript
        working-directory: Desktop_App_electron
        run: npm run build

      - name: Copy inputWorker
        working-directory: Desktop_App_electron
        run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js

      - name: Package macOS ARM
        working-directory: Desktop_App_electron
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Remove quarantine from DMG
        run: |
          cd Desktop_App_electron/release
          for dmg in *.dmg; do
            xattr -rc "$dmg"
          done

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm-dmg
          path: Desktop_App_electron/release/*.dmg