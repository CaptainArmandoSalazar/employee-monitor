name: Build & Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: Desktop_App_electron
        run: npm install

      - name: Build TypeScript
        working-directory: Desktop_App_electron
        run: npm run build

      - name: Copy inputWorker
        working-directory: Desktop_App_electron
        run: cp src/main/services/inputWorker.js dist/main/services/inputWorker.js

      - name: Package macOS Intel
        working-directory: Desktop_App_electron
        run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Remove quarantine from DMG
        run: |
          cd Desktop_App_electron/release
          for dmg in *.dmg; do
            [ -f "$dmg" ] || continue
            xattr -rc "$dmg"
          done

      - name: Upload to GitHub Release
        working-directory: Desktop_App_electron
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: $VERSION"

          # Install GitHub CLI
          brew install gh || true

          # Find DMG file
          DMG_FILE=$(ls release/*.dmg 2>/dev/null | head -1)
          YML_FILE=$(ls release/latest-mac.yml 2>/dev/null | head -1)

          if [ -z "$DMG_FILE" ]; then
            echo "❌ No DMG file found"
            ls release/
            exit 1
          fi

          echo "Found DMG: $DMG_FILE"

          # Check if release exists, create if not
          EXISTING=$(curl -s \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/tags/v$VERSION)

          RELEASE_ID=$(echo $EXISTING | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release v$VERSION..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases \
              -d "{\"tag_name\":\"v$VERSION\",\"name\":\"v$VERSION\",\"draft\":false,\"prerelease\":false,\"body\":\"Release v$VERSION\"}")
            RELEASE_ID=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          fi

          UPLOAD_URL="https://uploads.github.com/repos/CaptainArmandoSalazar/employee-monitor-releases/releases/$RELEASE_ID/assets"

          # Upload DMG
          FILENAME=$(basename "$DMG_FILE")
          echo "Uploading $FILENAME..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "$UPLOAD_URL?name=$FILENAME" \
            --data-binary @"$DMG_FILE"
          echo "✅ Uploaded $FILENAME"

          # Upload latest-mac.yml if exists
          if [ -n "$YML_FILE" ]; then
            echo "Uploading latest-mac.yml..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              "$UPLOAD_URL?name=latest-mac.yml" \
              --data-binary @"$YML_FILE"
            echo "✅ Uploaded latest-mac.yml"
          fi

          echo "🎉 Mac Intel release done!"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}